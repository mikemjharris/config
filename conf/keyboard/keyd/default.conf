# keyd remaps, applied to every keyboard. Works on Wayland, X11 and the console.
# Installed by conf/keyboard/setup-keyd.sh (symlinked to /etc/keyd/default.conf).
# Reload after editing: sudo keyd reload

[ids]
*

[main]
capslock = layer(control)

# Alt+C / Alt+V copy and paste, mac-style. Ctrl+Insert / Shift+Insert rather than
# Ctrl+C / Ctrl+V so it also works in terminals without sending an interrupt.
[alt]
c = C-insert
v = S-insert

# Win+hjkl as arrow keys (overrides GNOME's Super+H hide and Super+L lock).
[meta]
h = left
j = down
k = up
l = right
