<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Remote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #1a1b26;
      color: #c0caf5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #16161e;
      border-bottom: 1px solid #292e42;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #7aa2f7;
    }

    #status {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: #292e42;
      color: #565f89;
    }

    #status.connected { background: #1a2733; color: #73daca; }
    #status.busy { background: #2a1f1e; color: #f7768e; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #283457;
      color: #c0caf5;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: #1f2335;
      color: #c0caf5;
      border: 1px solid #292e42;
      border-bottom-left-radius: 2px;
    }

    .message.assistant code {
      background: #292e42;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 12px;
    }

    .message.assistant pre {
      background: #16161e;
      padding: 8px 10px;
      border-radius: 4px;
      margin: 6px 0;
      overflow-x: auto;
      font-size: 12px;
    }

    #thinking {
      align-self: flex-start;
      padding: 10px 14px;
      color: #565f89;
      font-size: 13px;
      display: none;
    }

    #thinking.visible { display: block; }

    #thinking::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    #input-area {
      padding: 12px 20px;
      background: #16161e;
      border-top: 1px solid #292e42;
      display: flex;
      gap: 10px;
    }

    #input {
      flex: 1;
      background: #1a1b26;
      border: 1px solid #292e42;
      border-radius: 6px;
      padding: 10px 14px;
      color: #c0caf5;
      font-family: inherit;
      font-size: 13px;
      resize: none;
      outline: none;
      min-height: 40px;
      max-height: 120px;
    }

    #input:focus { border-color: #7aa2f7; }

    #send {
      background: #7aa2f7;
      color: #1a1b26;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
    }

    #send:hover { background: #89b4fa; }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Claude Remote</h1>
    <span id="status">connecting...</span>
  </header>

  <div id="messages">
    <div id="thinking">Thinking</div>
  </div>

  <div id="input-area">
    <textarea id="input" placeholder="Send a message..." rows="1"></textarea>
    <button id="send">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const thinkingEl = document.getElementById('thinking');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const statusEl = document.getElementById('status');

    let lastId = null;
    let waiting = false;
    let pollInterval = null;

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.insertBefore(div, thinkingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
      const message = inputEl.value.trim();
      if (!message) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';
      sendBtn.disabled = true;

      addMessage(message, 'user');
      waiting = true;
      thinkingEl.classList.add('visible');

      try {
        const res = await fetch('/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        if (!res.ok) throw new Error('Send failed');
      } catch (err) {
        addMessage(`Error: ${err.message}`, 'assistant');
        waiting = false;
        thinkingEl.classList.remove('visible');
      }

      sendBtn.disabled = false;
    }

    async function poll() {
      try {
        const url = lastId ? `/poll?after=${encodeURIComponent(lastId)}` : '/poll';
        const res = await fetch(url);
        const data = await res.json();

        if (data.responses && data.responses.length > 0) {
          for (const r of data.responses) {
            addMessage(r.content, 'assistant');
            lastId = r.id;
          }
          waiting = false;
          thinkingEl.classList.remove('visible');
        }

        if (data.busy) {
          statusEl.textContent = 'thinking...';
          statusEl.className = 'busy';
        } else {
          statusEl.textContent = 'ready';
          statusEl.className = 'connected';
        }
      } catch {
        statusEl.textContent = 'disconnected';
        statusEl.className = '';
      }
    }

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // Send on Enter (Shift+Enter for newline)
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    sendBtn.addEventListener('click', send);

    // Start polling
    pollInterval = setInterval(poll, 1500);
    poll();
  </script>
</body>
</html>
