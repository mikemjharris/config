name: test-install

on:
  push:
    branches: [main]
    paths:
      - 'bin/install.sh'
      - 'bin/install-linux.sh'
      - 'bin/local-install.sh'
      - 'conf/**'
      - 'cli-tools/**'
      - 'Dockerfile.test-install'
      - '.dockerignore'
      - '.github/workflows/test-install.yml'
  pull_request:
  workflow_dispatch:

jobs:
  # Pull requests run this workflow whatever they change, so the required
  # "Install test" check below always reports; the builds only run when the
  # install files changed.
  changes:
    name: Install files changed
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.diff.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "install=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE \
            '^(bin/(install|install-linux|local-install)\.sh|conf/|cli-tools/|Dockerfile\.test-install$|\.dockerignore$|\.github/workflows/test-install\.yml$)'; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          else
            echo "install=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build install scripts on fresh Ubuntu ${{ matrix.ubuntu }}
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['22.04', '24.04', '26.04']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test-install image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.test-install
          push: false
          load: false
          build-args: UBUNTU_VERSION=${{ matrix.ubuntu }}
          cache-from: type=gha,scope=ubuntu-${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=ubuntu-${{ matrix.ubuntu }}

  # The required check for merging into main.
  install-ok:
    name: Install test
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "changes: ${{ needs.changes.result }}, build: ${{ needs.build.result }}"
          [ "${{ needs.changes.result }}" = success ]
          case "${{ needs.build.result }}" in success|skipped) ;; *) exit 1 ;; esac
